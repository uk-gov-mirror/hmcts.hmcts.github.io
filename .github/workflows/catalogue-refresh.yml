name: Refresh Platform Catalogue

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # This App must be installed on the hmcts organisation with read access
      # to every repository that may be catalogued. Unlike this repository's
      # GITHUB_TOKEN, its installation token can read metadata in other,
      # including private, organisation repositories.
      - name: Create catalogue GitHub App token
        id: catalogue-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HMCTS_CATALOGUE_APP_ID }}
          private-key: ${{ secrets.HMCTS_CATALOGUE_APP_PRIVATE_KEY }}
          owner: hmcts
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Refresh Terraform module catalogue
        run: bundle exec rake catalogue:refresh
        env:
          GH_TOKEN: ${{ steps.catalogue-app-token.outputs.token }}
      - name: Open PR with any changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Refresh Platform Catalogue data'
          title: 'Refresh Platform Catalogue'
          body: >
            Automated refresh of the Terraform module catalogue, scanned from
            `.hmcts/catalogue.yaml` in repos tagged `terraform-module` across
            the `hmcts` organisation.
          branch: catalogue-refresh
          delete-branch: true
          add-paths: data/terraform_modules.yml
