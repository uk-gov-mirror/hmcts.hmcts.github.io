# Generated by `bundle exec rake catalogue:refresh` (see rakelib/catalogue.rake
# and .github/workflows/catalogue-refresh.yml) from each repo's
# .hmcts/catalogue.yaml. Do not hand-edit entries sourced from a repo - they
# will be overwritten on the next refresh.
#
# Every entry below is a hand-written bootstrap sample: none of these repos
# has adopted .hmcts/catalogue.yaml yet, so these keep the Platform Catalogue
# page non-empty (and demonstrate the category/lifecycle filters) until real
# entries land. Each is grounded in a real repo carrying the 'terraform-module'
# GitHub topic; owner/version/category values are illustrative. Remove an
# entry once its repo has a real .hmcts/catalogue.yaml (catalogue:refresh will
# also retire it automatically once the repo's own entry appears).
- name: PostgreSQL Flexible Server
  repo: terraform-module-postgresql-flexible
  category: database
  description: Provisions an Azure Database for PostgreSQL Flexible Server.
  owner: data-domain
  lifecycle: supported
  maturity: production
  version:
    recommended:
  terraform:
    minimum_version:
  providers:
    azurerm:
  links:
    documentation: https://github.com/hmcts/terraform-module-postgresql-flexible#readme
    examples: https://github.com/hmcts/terraform-module-postgresql-flexible/tree/main/example
    repository: https://github.com/hmcts/terraform-module-postgresql-flexible
  replacement:
  bootstrap_sample: true
