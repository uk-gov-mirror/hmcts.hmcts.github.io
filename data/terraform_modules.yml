---
- apiVersion: catalogue.hmcts.gov.uk/v1
  id: application-insights
  name: Application Insights
  type: terraform-module
  category: observability
  description: Sets the standard configuration for an Application Insights instance.
  owner: cloud-platform
  lifecycle: experimental
  maturity: beta
  consumption:
    model: self-service
    deployed_by: consuming team
  platform:
    approved: false
  usage:
    new_deployments: restricted
    existing_deployments: allowed
  version:
    recommended: 0.4.0
  terraform:
    minimum_version: 1.6.0
  providers:
    azurerm: ">= 4.0, < 5.0"
  repository:
    url: https://github.com/hmcts/terraform-module-application-insights
    default_branch: main
    archived: false
    topics:
    - terraform-module
  supported_environments:
  - sandbox
  - development
  - test
  links:
    documentation: https://github.com/hmcts/terraform-module-application-insights#readme
    examples: https://github.com/hmcts/terraform-module-application-insights/tree/main/examples/basic
  support:
    contact: "#platops"
  repo: terraform-module-application-insights
  default_branch: main
